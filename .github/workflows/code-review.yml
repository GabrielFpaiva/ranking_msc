name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR as a senior Python developer.
            Focus on:
            - Bugs and logic errors
            - Security vulnerabilities
            - Code style and naming conventions (follow CLAUDE.md)
            - Type hints and proper exception handling
            - Test coverage for new code
            Be concise. Only comment on real issues, not style nitpicks.
            Write review comments in Portuguese (pt-BR).
