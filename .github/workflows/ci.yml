name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres para os testes do schema (tests/test_db.py); sem ele, são pulados.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MCRA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Sem "cp settings.yaml.example → settings.yaml": os testes são
      # herméticos (tests/conftest.py gera a config a partir do example).
      # Rodar sem o cp garante que um clone limpo passa.
      - name: Ruff
        run: ruff check src tests app desktop

      - name: Mypy
        run: mypy src app/api desktop

      - name: Pytest (com gate de cobertura)
        # Cobertura atual: 95% — gate em 90 segura regressões sem ser frágil.
        run: pytest --cov=ranking_msc --cov=app --cov-report=term --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test
