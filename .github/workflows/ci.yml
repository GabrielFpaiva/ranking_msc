name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Sem "cp settings.yaml.example → settings.yaml": os testes são
      # herméticos (tests/conftest.py gera a config a partir do example).
      # Rodar sem o cp garante que um clone limpo passa.
      - name: Ruff
        run: ruff check src tests app

      - name: Mypy
        run: mypy src app/api

      - name: Pytest (com gate de cobertura)
        # Cobertura atual: 95% — gate em 90 segura regressões sem ser frágil.
        run: pytest --cov=ranking_msc --cov=app --cov-report=term --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test
