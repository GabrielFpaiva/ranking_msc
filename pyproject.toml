[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ranking-msc"
version = "0.1.0"
description = "Motor de validação contábil MSC para o Ranking SICONFI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.1",
    "pyarrow>=14.0",          # leitura/escrita de Parquet
    "pyyaml>=6.0",
    "openpyxl>=3.1",          # exportação Excel
    "fastapi>=0.110",         # API que serve o motor para o frontend MCRA
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9", # uploads multipart (POST /api/run)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",              # linter + formatter
    "mypy>=1.7",
    "pandas-stubs>=2.1",
    "types-openpyxl>=3.1.5",
    "types-PyYAML>=6.0",
    "httpx>=0.27",            # TestClient do FastAPI usa httpx
]

[tool.hatch.build.targets.wheel]
packages = ["src/ranking_msc"]

# ---------------------------------------------------------------------------
# Ferramentas de qualidade
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
