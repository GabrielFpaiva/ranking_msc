[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ranking-msc"
version = "0.1.0"
description = "Motor de validação contábil MSC para o Ranking SICONFI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.1",
    "pyarrow>=14.0",          # leitura/escrita de Parquet
    "pyyaml>=6.0",
    "openpyxl>=3.1",          # exportação Excel
    "fastapi>=0.110",         # API que serve o motor para o frontend MCRA
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9", # uploads multipart (POST /api/run)
    "python-jose[cryptography]>=3.3", # JWT — autenticação F5-04
    "bcrypt>=4.0",                    # hash de senhas — autenticação F5-04
    "reportlab>=4.0",                 # PDF executivo branded — F5-18
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",              # linter + formatter
    "mypy>=1.7",
    "pandas-stubs>=2.1",
    "types-openpyxl>=3.1.5",
    "types-PyYAML>=6.0",
    "httpx>=0.27",            # TestClient do FastAPI usa httpx
    # bcrypt>=4.0 inclui stubs PEP 561 inline — sem pacote types-bcrypt necessário
]

[tool.hatch.build.targets.wheel]
packages = ["src/ranking_msc"]

# ---------------------------------------------------------------------------
# Ferramentas de qualidade
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
# 3.12 casa com o runtime real (CI e Docker) e permite parsear os stubs do
# numpy >= 2.2, que usam `type statement` (sintaxe 3.12+). Com "3.11" o mypy
# aborta em site-packages antes de checar o projeto.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.lib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jose", "jose.exceptions", "passlib.context"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
