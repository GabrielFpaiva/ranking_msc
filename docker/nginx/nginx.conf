worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Redireciona HTTP para HTTPS, exceto o desafio ACME do Let's Encrypt,
    # que precisa ser servido em texto plano na porta 80 para a emissao e a
    # renovacao do certificado funcionarem sem derrubar o servico.
    server {
        listen 80;
        server_name _;

        # Este location vence o "location /" abaixo por ser o PREFIXO MAIS
        # LONGO que casa (regra de precedencia do nginx) -- nao por vir
        # antes no arquivo. Nao reordene os blocos achando que a ordem e o
        # mecanismo: um "location /" declarado antes deste continuaria
        # perdendo para o prefixo mais especifico.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Uploads de CSV MSC podem ser grandes; o app não impõe limite próprio,
        # então este é o portão efetivo. Evita HTTP 413.
        client_max_body_size 200m;

        location / {
            # Resolve o upstream em tempo de execução via DNS interno do Docker
            # (127.0.0.11). Sem isso, o proxy_pass com host literal fixa o IP
            # resolvido no startup; ao recriar o container `app` (novo IP) o
            # nginx devolveria 502 até ser reiniciado. A variável + resolver
            # força nova resolução conforme o TTL `valid`.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $upstream_app app;
            proxy_pass http://$upstream_app:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Processamento de uma competência pode demorar; evita HTTP 504.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
